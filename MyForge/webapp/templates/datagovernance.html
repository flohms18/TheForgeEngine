{% extends "base.html" %}

{% block title %}{{ post.title }} - Forge{% endblock %}

{% block content %}
<section>
    <div class="hero-section flex flex-col w-screen bg-white-brand font-display items-center justify-center text-center h-96 px-6">
        <h1 class="text-dark-brand text-5xl font-semibold">{{ post.title }}</h1>
    </div>
</section>

<section class="bg-white-brand">
    <div class="mx-auto max-w-3xl px-6 pb-24 lg:px-8">
        <a href="{% url 'home' %}" class="font-display text-sm text-blue-brand hover:underline">&larr; Back</a>

        {% if post.tags.all %}
        <div class="mt-4 flex flex-wrap gap-2">
            {% for tag in post.tags.all %}
            <span class="rounded-md bg-blue-brand/10 px-3 py-1 text-sm text-blue-brand">{{ tag.name }}</span>
            {% endfor %}
        </div>
        {% endif %}

        <div class="article-content font-ibm mt-8 text-dark-brand">
            {{ post.content|safe }}
        </div>
    </div>
</section>
{% endblock %}
