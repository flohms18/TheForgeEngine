<header class="relative inset-x-0 top-0 z-50 bg-dark-brand">
  <nav aria-label="Global" class="flex items-center justify-between p-4 sm:p-6 lg:px-8">
    <div class="flex flex-1"></div>
    <a href="{% url 'home' %}" class="font-heading -m-1.5 p-1.5 text-2xl font-display text-blue-brand sm:text-3xl">
      Forge
    </a>
    <div class="flex flex-1 items-center justify-end">
      <button type="button" command="show-modal" commandfor="mobile-menu" class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-blue-brand lg:hidden">
        <span class="sr-only">Open main menu</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
          <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="hidden lg:flex lg:gap-x-4">
        <a href="https://www.linkedin.com/in/florent-trouillet/" target="_blank" rel="noopener noreferrer" class="rounded-md px-3 py-1.5 text-sm/6 font-display font-semibold text-blue-brand ring-1 ring-blue-brand/30 hover:bg-blue-brand/10">Linkedin</a>
        <a href="https://github.com/flohms18" target="_blank" rel="noopener noreferrer" class="rounded-md px-3 py-1.5 text-sm/6 font-display font-semibold text-blue-brand ring-1 ring-blue-brand/30 hover:bg-blue-brand/10">Github</a>
      </div>
    </div>
  </nav>
  <el-dialog>
    <dialog id="mobile-menu" class="backdrop:bg-transparent lg:hidden">
      <div tabindex="0" class="fixed inset-0 focus:outline-none">
        <el-dialog-panel class="fixed inset-y-0 right-0 z-50 w-full overflow-y-auto bg-dark-brand p-6 sm:max-w-sm sm:ring-1 sm:ring-gray-100/10">
          <div class="flex items-center justify-between">
            <a href="{% url 'home' %}" class="font-heading -m-1.5 p-1.5 text-lg font-semibold text-blue-brand">
              Forge
            </a>
            <button type="button" command="close" commandfor="mobile-menu" class="-m-2.5 rounded-md p-2.5 text-blue-brand">
              <span class="sr-only">Close menu</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="mt-6 flow-root">
            <div class="-my-6 divide-y divide-white/10">
              <div class="space-y-2 py-6">
                <a href="https://www.linkedin.com/in/florent-trouillet/" target="_blank" rel="noopener noreferrer" class="-mx-3 block rounded-lg px-3 py-2 text-base/7 font-display text-blue-brand hover:bg-blue-brand/5">Linkedin</a>
                <a href="https://github.com/flohms18" target="_blank" rel="noopener noreferrer" class="-mx-3 block rounded-lg px-3 py-2 text-base/7 font-display text-blue-brand hover:bg-blue-brand/5">Github</a>
              </div>
            </div>
          </div>
        </el-dialog-panel>
      </div>
    </dialog>
  </el-dialog>
</header>
